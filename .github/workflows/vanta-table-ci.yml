name: Vanta Table CI

on:
  push:
    paths:
      - "apps/vanta-table/**"
      - ".github/workflows/vanta-table-ci.yml"
  pull_request:
    paths:
      - "apps/vanta-table/**"
      - ".github/workflows/vanta-table-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vanta-table

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build
